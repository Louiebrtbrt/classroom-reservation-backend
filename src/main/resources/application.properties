# Port: Render gives PORT, local default is 3000 (same as the Node version)
server.port=${PORT:3000}

# Reads a local .env file if it exists (same KEY=value file you used with Node)
spring.config.import=optional:file:.env[.properties]

# Database (same environment variables as the Node version)
# MYSQL_SSL_MODE: REQUIRED for Aiven (default). Use DISABLED for local XAMPP MySQL.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:crs}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&tinyInt1isBit=false&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# Brevo email
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:luwiserrano@gmail.com}
brevo.sender-name=Classroom Reservation System

spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000